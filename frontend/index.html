<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pix Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b1220;
    --panel: #121a2b;
    --panel-2: #182339;
    --line: #24314a;
    --teal: #00c2a8;
    --teal-dim: #0a8f7d;
    --paper: #edf2f4;
    --muted: #8593a8;
    --amber: #e8a33d;
    --coral: #e8575a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .brand .mark {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--teal);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    font-size: 16px;
    font-weight: 700;
  }
  .status {
    display: flex; align-items: center; gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .dot.up { background: var(--teal); box-shadow: 0 0 8px var(--teal); }
  .dot.down { background: var(--coral); }

  .layout {
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 32px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 24px 20px; }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
  }
  .card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 500;
    margin: 0 0 20px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 16px 0 6px;
  }
  label:first-of-type { margin-top: 0; }
  select, input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
  }
  select:focus, input:focus {
    outline: none;
    border-color: var(--teal);
  }
  input[type=number] { font-family: 'IBM Plex Mono', monospace; }

  button {
    width: 100%;
    margin-top: 20px;
    background: var(--teal);
    color: var(--ink);
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  button:hover { background: #1adfc4; }
  button:active { transform: scale(0.98); }
  button:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

  .feedback {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
    display: none;
  }
  .feedback.ok { display: block; background: rgba(0,194,168,0.1); border: 1px solid var(--teal-dim); color: var(--teal); }
  .feedback.err { display: block; background: rgba(232,87,90,0.1); border: 1px solid var(--coral); color: var(--coral); }

  .accounts-grid {
    display: grid;
    gap: 12px;
  }
  .account-pill {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .account-pill .key { font-size: 14px; }
  .account-pill .balance {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    color: var(--teal);
  }

  .ledger-card { grid-column: 1 / -1; }
  .ledger { display: flex; flex-direction: column; gap: 8px; }
  .ledger-empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  .ledger-row {
    display: grid;
    grid-template-columns: 90px 1fr auto 110px;
    align-items: center;
    gap: 16px;
    padding: 12px 14px;
    background: var(--panel-2);
    border-radius: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    animation: settle 0.4s ease;
  }
  @keyframes settle {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .ledger-row .time { color: var(--muted); }
  .ledger-row .flow { color: var(--paper); }
  .ledger-row .amount { text-align: right; }
  .pill {
    justify-self: end;
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .pill.completed { background: rgba(0,194,168,0.15); color: var(--teal); }
  .pill.pending { background: rgba(232,163,61,0.15); color: var(--amber); }
  .pill.failed { background: rgba(232,87,90,0.15); color: var(--coral); }

  .footer-note {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 32px 40px;
    color: var(--muted);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">P</span> Pix Simulator</div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">verificando conexão…</span></div>
</div>

<div class="layout">

  <div class="card">
    <h2>Nova transferência</h2>
    <label for="sourceSelect">De</label>
    <select id="sourceSelect"></select>

    <label for="targetSelect">Para</label>
    <select id="targetSelect"></select>

    <label for="amountInput">Valor (R$)</label>
    <input type="number" id="amountInput" min="0.01" step="0.01" placeholder="0,00">

    <button id="transferBtn" disabled>Transferir →</button>
    <div class="feedback" id="transferFeedback"></div>
  </div>

  <div class="card">
    <h2>Contas</h2>
    <div class="accounts-grid" id="accountsGrid">
      <div class="ledger-empty">Carregando contas…</div>
    </div>

    <label for="newPixKey" style="margin-top:24px;">Nova chave Pix (e-mail, CPF, etc.)</label>
    <input type="text" id="newPixKey" placeholder="voce@email.com">
    <label for="newBalance">Saldo inicial (R$)</label>
    <input type="number" id="newBalance" min="0" step="0.01" placeholder="0,00">
    <button id="createAccountBtn" style="background: var(--panel-2); color: var(--paper); border: 1px solid var(--line);">+ Criar conta</button>
    <div class="feedback" id="createFeedback"></div>
  </div>

  <div class="card ledger-card">
    <h2>Atividade da sessão</h2>
    <div class="ledger" id="ledger">
      <div class="ledger-empty">Nenhuma transferência ainda. Envie a primeira acima.</div>
    </div>
  </div>

</div>

<div class="footer-note">
  transaction-service :8080 · account-service :8081 — rodando localmente via Docker Compose
</div>

<script>
const TX_API = 'http://localhost:8080/api/v1/pix';
const ACC_API = 'http://localhost:8081/api/v1/accounts';

let accounts = [];

function formatBRL(value) {
  return Number(value).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function shortId(id) {
  return id.slice(0, 8);
}

async function checkHealth() {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  try {
    const res = await fetch(ACC_API);
    if (res.ok) {
      dot.className = 'dot up';
      text.textContent = 'serviços conectados';
    } else {
      throw new Error('bad status');
    }
  } catch (e) {
    dot.className = 'dot down';
    text.textContent = 'sem conexão — verifique se os serviços estão rodando';
  }
}

async function loadAccounts() {
  try {
    const res = await fetch(ACC_API);
    accounts = await res.json();
    renderAccounts();
    populateSelects();
  } catch (e) {
    document.getElementById('accountsGrid').innerHTML =
      '<div class="ledger-empty">Não foi possível carregar as contas. O account-service está rodando na porta 8081?</div>';
  }
}

function renderAccounts() {
  const grid = document.getElementById('accountsGrid');
  const transferBtn = document.getElementById('transferBtn');

  if (accounts.length === 0) {
    grid.innerHTML = '<div class="ledger-empty">Nenhuma conta ainda.<br>Crie a primeira logo abaixo.</div>';
    transferBtn.disabled = true;
    return;
  }
  if (accounts.length === 1) {
    grid.innerHTML += '';
  }
  grid.innerHTML = accounts.map(acc => `
    <div class="account-pill">
      <span class="key">${acc.pixKey}</span>
      <span class="balance">${formatBRL(acc.balance)}</span>
    </div>
  `).join('');

  transferBtn.disabled = accounts.length < 2;
}

async function createAccount() {
  const pixKey = document.getElementById('newPixKey').value.trim();
  const balance = parseFloat(document.getElementById('newBalance').value);
  const feedback = document.getElementById('createFeedback');
  const btn = document.getElementById('createAccountBtn');

  feedback.className = 'feedback';

  if (!pixKey) {
    feedback.className = 'feedback err';
    feedback.textContent = 'Informe uma chave Pix.';
    return;
  }
  if (isNaN(balance) || balance < 0) {
    feedback.className = 'feedback err';
    feedback.textContent = 'Informe um saldo inicial válido (pode ser 0).';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Criando…';

  try {
    const res = await fetch(ACC_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pixKey, initialBalance: balance })
    });
    const data = await res.json();

    if (res.ok) {
      feedback.className = 'feedback ok';
      feedback.textContent = `Conta criada: ${data.pixKey}`;
      document.getElementById('newPixKey').value = '';
      document.getElementById('newBalance').value = '';
      await loadAccounts();
    } else {
      feedback.className = 'feedback err';
      feedback.textContent = data.message || 'Não foi possível criar a conta.';
    }
  } catch (e) {
    feedback.className = 'feedback err';
    feedback.textContent = 'Erro de conexão com o account-service (porta 8081).';
  } finally {
    btn.disabled = false;
    btn.textContent = '+ Criar conta';
  }
}

document.getElementById('createAccountBtn').addEventListener('click', createAccount);

function populateSelects() {
  const options = accounts.map(acc =>
    `<option value="${acc.id}">${acc.pixKey} (${shortId(acc.id)})</option>`
  ).join('');
  document.getElementById('sourceSelect').innerHTML = options;
  document.getElementById('targetSelect').innerHTML = options;
  if (accounts.length > 1) {
    document.getElementById('targetSelect').selectedIndex = 1;
  }
}

function addLedgerRow(sourceKey, targetKey, amount, status) {
  const ledger = document.getElementById('ledger');
  const empty = ledger.querySelector('.ledger-empty');
  if (empty) empty.remove();

  const time = new Date().toLocaleTimeString('pt-BR');
  const pillClass = status === 'COMPLETED' ? 'completed' : status === 'FAILED' ? 'failed' : 'pending';
  const pillLabel = status === 'COMPLETED' ? 'concluído' : status === 'FAILED' ? 'falhou' : 'processando';

  const row = document.createElement('div');
  row.className = 'ledger-row';
  row.innerHTML = `
    <span class="time">${time}</span>
    <span class="flow">${sourceKey} → ${targetKey}</span>
    <span class="amount">${formatBRL(amount)}</span>
    <span class="pill ${pillClass}">${pillLabel}</span>
  `;
  ledger.prepend(row);
}

document.getElementById('transferBtn').addEventListener('click', async () => {
  const sourceId = document.getElementById('sourceSelect').value;
  const targetId = document.getElementById('targetSelect').value;
  const amount = parseFloat(document.getElementById('amountInput').value);
  const feedback = document.getElementById('transferFeedback');
  const btn = document.getElementById('transferBtn');

  feedback.className = 'feedback';
  feedback.textContent = '';

  if (!sourceId || !targetId || !amount || amount <= 0) {
    feedback.className = 'feedback err';
    feedback.textContent = 'Preencha origem, destino e um valor válido.';
    return;
  }
  if (sourceId === targetId) {
    feedback.className = 'feedback err';
    feedback.textContent = 'Origem e destino não podem ser a mesma conta.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Processando…';

  const sourceAcc = accounts.find(a => a.id === sourceId);
  const targetAcc = accounts.find(a => a.id === targetId);
  const endToEndId = 'WEB-' + Date.now().toString(36).toUpperCase();

  try {
    const res = await fetch(`${TX_API}/transfer`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        endToEndId,
        sourceAccountId: sourceId,
        targetAccountId: targetId,
        amount: amount
      })
    });
    const data = await res.json();

    if (res.ok) {
      feedback.className = 'feedback ok';
      feedback.textContent = `Transferência concluída — id ${shortId(data.transactionId)}`;
      addLedgerRow(sourceAcc.pixKey, targetAcc.pixKey, amount, 'COMPLETED');
      document.getElementById('amountInput').value = '';
      await loadAccounts();
    } else {
      feedback.className = 'feedback err';
      feedback.textContent = data.message || 'A transferência não pôde ser concluída.';
      addLedgerRow(sourceAcc.pixKey, targetAcc.pixKey, amount, 'FAILED');
    }
  } catch (e) {
    feedback.className = 'feedback err';
    feedback.textContent = 'Erro de conexão com o transaction-service (porta 8080).';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Transferir →';
  }
});

checkHealth();
loadAccounts();
setInterval(checkHealth, 8000);
</script>

</body>
</html>
