spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pix_transactions
    username: pixuser
    password: pixpass
    hikari:
      # pool dimensionado para não sobrecarregar o Postgres sob alta
      # concorrência (regra prática: 2-4x núcleos de CPU do DB)
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate   # migrations via Flyway, nunca auto-DDL em "produção"
    properties:
      hibernate:
        jdbc.batch_size: 20
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all           # aguarda confirmação de todas as réplicas — durabilidade
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true   # evita duplicação de eventos em retry do producer

resilience4j:
  circuitbreaker:
    instances:
      pixTransfer:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        failure-rate-threshold: 50      # abre o circuito com 50% de falhas
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        # Erros de REGRA DE NEGÓCIO (saldo insuficiente, dados inválidos) não
        # devem contar como falha do circuito — o sistema está saudável,
        # é o pedido do cliente que é inválido. Só falhas de infraestrutura
        # (banco fora, timeout, etc.) devem abrir o circuito.
        ignore-exceptions:
          - com.pixsim.transaction.domain.InsufficientFundsException
          - java.lang.IllegalArgumentException

  ratelimiter:
    instances:
      pixTransfer:
        limit-for-period: 200           # 200 requisições
        limit-refresh-period: 1s        # por segundo, por instância
        timeout-duration: 500ms         # espera máx. antes de rejeitar

  retry:
    instances:
      pixTransfer:
        # 3 tentativas eram insuficientes sob alta contenção real (ex: 50
        # transferências simultâneas na mesma conta "quente", como um PIX
        # de loja popular) — muitas threads esgotavam as tentativas e
        # falhavam de vez, mesmo o lock otimista funcionando corretamente.
        # 10 tentativas com backoff mais suave dão tempo de todas
        # eventualmente conseguirem seu turno sem martelar o banco.
        max-attempts: 15
        wait-duration: 30ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 1.5
        # IMPORTANTE: sob isolamento REPEATABLE_READ, o PRÓPRIO Postgres
        # detecta conflitos de escrita concorrente e lança um erro de
        # serialização (SQLSTATE 40001), que o Spring traduz para
        # CannotAcquireLockException — uma camada de proteção DIFERENTE
        # do nosso lock otimista via @Version (que gera
        # OptimisticLockingFailureException). Sob alta contenção, o
        # Postgres costuma detectar o conflito primeiro. Por isso
        # escutamos o tipo-pai ConcurrencyFailureException, que cobre
        # ambos os casos — só assim o retry realmente reage a qualquer
        # forma de conflito de concorrência, não só uma das duas.
        retry-exceptions:
          - org.springframework.dao.ConcurrencyFailureException

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, circuitbreakers
  health:
    circuitbreakers:
      enabled: true
