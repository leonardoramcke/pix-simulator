global:
  scrape_interval: 5s        # coleta métricas a cada 5s — granularidade
                              # suficiente para ver latência/erros quase em
                              # tempo real sem sobrecarregar o serviço

scrape_configs:
  - job_name: 'transaction-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # host.docker.internal: forma padrão do Docker Desktop (Windows/Mac)
      # de um container acessar serviços rodando na máquina host — nosso
      # caso, já que a aplicação Spring Boot roda via 'mvnw spring-boot:run'
      # direto no Windows, não dentro do docker-compose.
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'pix-transaction-service'
