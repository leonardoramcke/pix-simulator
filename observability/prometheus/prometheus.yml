global:
  scrape_interval: 5s        # coleta métricas a cada 5s — granularidade
                              # suficiente para ver latência/erros quase em
                              # tempo real sem sobrecarregar o serviço

scrape_configs:
  - job_name: 'transaction-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # Nome do serviço no docker-compose ('transaction-service') — o
      # Docker resolve isso automaticamente via DNS interno da rede
      # criada pelo compose, sem precisar de IP fixo.
      - targets: ['transaction-service:8080']
        labels:
          service: 'pix-transaction-service'
