services:

  postgres:
    image: postgres:16-alpine
    container_name: pix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixuser
      POSTGRES_PASSWORD: pixpass
      POSTGRES_DB: pix_transactions
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixuser -d pix_transactions"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka em modo KRaft: não precisa de Zookeeper separado (padrão desde Kafka 3.x+).
  # Um único broker é suficiente para o simulador local.
  kafka:
    image: apache/kafka:3.7.0
    container_name: pix-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Interface web para inspecionar tópicos e mensagens do Kafka.
  # Acesse em http://localhost:8085 depois do 'docker compose up'.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pix-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pix-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Coleta métricas expostas pela aplicação em /actuator/prometheus a cada
  # 5s (taxa de requisição, latência, estado do circuit breaker, pool de
  # conexões etc). Acesse http://localhost:9090 para consultar métricas
  # brutas ou conferir se o alvo (target) está sendo coletado com sucesso.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pix-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # necessário no Linux para host.docker.internal funcionar (no
      # Windows/Mac já funciona nativamente, mas manter aqui não atrapalha
      # e deixa o compose portável entre sistemas operacionais)
      - "host.docker.internal:host-gateway"

  # Visualização das métricas coletadas pelo Prometheus. Datasource e
  # dashboard já vêm pré-configurados via provisioning — abra
  # http://localhost:3000 (login: admin/admin) e o dashboard
  # "Pix Simulator - Transaction Service" já aparece pronto, sem
  # configuração manual.
  grafana:
    image: grafana/grafana:11.1.0
    container_name: pix-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  # --- Microsserviços da aplicação ---
  # Cada um usa build multi-stage (Dockerfile dentro da própria pasta do
  # serviço), então não é necessário ter Java/Maven instalados na máquina
  # para rodar o projeto inteiro — só Docker.
  #
  # As variáveis SPRING_DATASOURCE_URL e SPRING_KAFKA_BOOTSTRAP_SERVERS
  # sobrescrevem o application.yml de cada serviço (que aponta para
  # 'localhost', pensado para quando o serviço roda direto na máquina via
  # 'mvnw spring-boot:run'). Dentro da rede Docker, os containers se
  # enxergam pelo NOME do serviço, não por 'localhost' — por isso a
  # sobrescrita aqui.
  transaction-service:
    build: ./transaction-service
    container_name: pix-transaction-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pix_transactions
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  account-service:
    build: ./account-service
    container_name: pix-account-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Precisa que o transaction-service já tenha rodado as migrations
      # Flyway (dono do schema da tabela 'accounts') antes de subir —
      # senão a validação do Hibernate ('ddl-auto: validate') falha por
      # não encontrar a tabela ainda.
      transaction-service:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pix_transactions

  notification-service:
    build: ./notification-service
    container_name: pix-notification-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

volumes:
  pgdata:
  grafana-data:
